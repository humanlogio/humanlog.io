kind: Service
apiVersion: v1
metadata:
  name: humanlogio-service
  annotations:
    # service.beta.kubernetes.io/do-loadbalancer-certificate-id: "1234-5678-9012-3456"
    # service.beta.kubernetes.io/do-loadbalancer-protocol: "https"
    # service.beta.kubernetes.io/do-loadbalancer-hostname: "humanlog.io"
spec:
  type: LoadBalancer
  selector:
    app: humanlogio
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: { { .Values.app.port } }
