name: update api version

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Version to update to"
        required: true
        type: string
  repository_dispatch:
    types: [update_api_version]

jobs:
  set_humanlog_package_version:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      GH_ACCESS_TOKEN_FOR_AUTO_PR: ${{ secrets.GH_ACCESS_TOKEN_FOR_AUTO_PR }}
      PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package_version || github.event.client_payload.package_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Check outputs
        run: echo "will set api@$PACKAGE_VERSION"

      - run: ./script/update_api_version.sh $PACKAGE_VERSION
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN_FOR_AUTO_PR }}
          title: "chore(pro): bump api@${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package_version || github.event.client_payload.package_version }}"
          commit-message: "chore(pro): bump api@${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package_version || github.event.client_payload.package_version }}"
          branch: "bump-api"
