name: 🚀 to prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (usually a short sha)."
        type: string
        required: true
jobs:
  shipit:
    name: "🚀 to prod"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger `deploy/set_humanlogio_tag`
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TRIGGER_EVENT_GITHUB_PAT }}
          repository: humanlogio/deploy
          event-type: set_humanlogio_tag
          client-payload: '{"deploy_tag": "${{github.event.inputs.tag}}", "env": "prod"}'
